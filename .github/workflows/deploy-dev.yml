name: deploy-dev

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.7.0 }
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aicc2/shared build
      - run: pnpm --filter @aicc2/db prisma:generate
      - run: pnpm --filter @aicc2/tool-router build
      - run: pnpm --filter @aicc2/telephony-bridge build
      - run: pnpm --filter @aicc2/infra deploy:dev
